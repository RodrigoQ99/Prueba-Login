<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lectura</title>

    <link rel="stylesheet"
          href="estilos.css">

    <!-- Firebase (versión compat, para usar sin bundler) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

</head>


<body class="pantallaLectura">


<!-- ==========================
     PANTALLA DE LOGIN
=========================== -->
<div id="pantallaLogin" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Lectura QR</h1>
        <p>Inicia sesión para comenzar tu lectura y ganar premios.</p>
        <button id="btnLoginGoogle" class="botonGoogle">
            Iniciar sesión con Google
        </button>
    </div>
</div>


<!-- ==========================
     PANTALLA DE REGISTRO (solo primera vez)
=========================== -->
<div id="pantallaRegistro" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Un último paso</h1>
        <p>Cuéntanos cómo vas a participar:</p>

        <form id="formRegistro">

            <label class="opcionTipo">
                <input type="radio" name="tipoUsuario" value="particular" checked>
                Participante particular
            </label>
            <br>
            <label class="opcionTipo">
                <input type="radio" name="tipoUsuario" value="estudiante">
                Estudiante (compito por mi colegio)
            </label>

            <div id="camposEstudiante" style="display:none; margin-top:15px;">
                <input type="text" id="inputColegio" placeholder="Nombre completo del colegio (ej. Colegio Unis)">
                <small style="display:block; color:#888; margin:-8px 0 10px;">
                    Escribe el nombre completo, igual que tus compañeros, para que sus puntos se sumen juntos.
                </small>
                <label style="display:block; text-align:left; color:#555; font-size:13px; margin:8px 0 4px;">Grado</label>
                <select id="inputGrado"></select>
            </div>

            <div id="datosPerfilRegistro" style="margin-top:15px;">
                <label style="display:block; text-align:left; color:#555; font-size:13px; margin-bottom:4px;">Fecha de nacimiento</label>
                <input type="date" id="inputFechaNacimiento">
                <label style="display:block; text-align:left; color:#555; font-size:13px; margin:10px 0 4px;">País</label>
                <select id="inputPais" required></select>
                <input type="text" id="inputLenguaMaterna" placeholder="Lengua materna">
                <label style="display:block; text-align:left; color:#555; font-size:13px; margin:10px 0 4px;">Género</label>
                <label class="opcionTipo" style="display:inline-flex; align-items:center; gap:6px; width:auto; margin-right:15px;">
                    <input type="radio" name="generoRegistro" value="hombre"> Hombre
                </label>
                <label class="opcionTipo" style="display:inline-flex; align-items:center; gap:6px; width:auto;">
                    <input type="radio" name="generoRegistro" value="mujer"> Mujer
                </label>
            </div>

            <p style="font-weight:600; margin:15px 0 8px;">¿Qué géneros de lectura te gustan?</p>
            <div id="contenedorGenerosRegistro"></div>

            <button type="submit" style="margin-top:15px;">Continuar</button>

        </form>
    </div>
</div>


<div id="contenedor" style="display:none;">


    <div id="temporizador" style="display:none;">
        00:00
    </div>



    <h1 id="tituloLectura" style="display:none;">
        Cargando...
    </h1>



    <!-- ==========================
         LECTURA (se llena automáticamente según el QR)
    =========================== -->


    <div id="lectura" style="display:none;">
    </div>


    <button id="btnIrCuestionario"
            onclick="pasarACuestionarioAhora()"
            style="display:none;">
        Ya terminé de leer → Ir al cuestionario
    </button>




    <!-- ==========================
         CUESTIONARIO (se llena automáticamente)
    =========================== -->


    <div id="cuestionario" style="display:none;">



        <div id="temporizadorCuestionario">
            Tiempo: 00:00
        </div>



        <h2>
            Cuestionario
        </h2>


        <div id="listaPreguntas">
        </div>


        <button id="btnTerminarCuestionario" onclick="calificar()">
            Terminar cuestionario
        </button>


        <h2 id="resultado"></h2>

        <h2 id="mensajeFinal"></h2>


    </div>


</div>




<script src="firebase-init.js"></script>
<script src="admin-comun.js"></script>
<script src="generos.js"></script>
<script src="paises.js"></script>
<script src="grados.js"></script>
<script src="lecturas.js"></script>
<script src="racha.js"></script>
<script src="premio-gordo-comun.js"></script>
<script src="puntos.js"></script>
<script src="motor.js"></script>
<script src="auth.js"></script>


</body>


</html>
