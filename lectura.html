<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lectura</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">

    <link rel="stylesheet"
          href="estilos.css">

    <!-- Firebase (versión compat, para usar sin bundler) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>

</head>


<body class="pantallaLectura">


<!-- ==========================
     PANTALLA DE LOGIN
=========================== -->
<div id="pantallaLogin" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1 class="marcaAuth">Trifle</h1>
        <blockquote class="citaAuth">
            <p>Un lector vive mil vidas antes de morir. El hombre que nunca lee vive solo una.</p>
            <cite>— George R.R. Martin</cite>
        </blockquote>
        <button id="btnLoginGoogle" class="botonGoogle">
            Iniciar sesión con Google
        </button>
    </div>
</div>


<!-- ==========================
     PANTALLA DE REGISTRO (solo primera vez)
=========================== -->
<div id="pantallaRegistro" class="pantallaAuth" style="display:none;"></div>
<!-- El formulario de registro (4 pasos) lo arma registro.js -->


<div id="contenedor" style="display:none;">


    <div id="temporizador" style="display:none;">
        00:00
    </div>



    <h1 id="tituloLectura" style="display:none;">
        Cargando...
    </h1>



    <!-- ==========================
         LECTURA (se llena automáticamente según el QR)
    =========================== -->


    <div id="lectura" style="display:none;">
    </div>


    <button id="btnIrCuestionario"
            onclick="pasarACuestionarioAhora()"
            style="display:none;">
        Ya terminé de leer → Ir al cuestionario
    </button>




    <!-- ==========================
         CUESTIONARIO (se llena automáticamente)
    =========================== -->


    <div id="cuestionario" style="display:none;">



        <div id="temporizadorCuestionario">
            Tiempo: 00:00
        </div>



        <h2>
            Cuestionario
        </h2>


        <div id="listaPreguntas">
        </div>


        <button id="btnTerminarCuestionario" onclick="calificar()">
            Terminar cuestionario
        </button>


        <h2 id="resultado"></h2>

        <h2 id="mensajeFinal"></h2>


    </div>


</div>




<script src="firebase-init.js"></script>
<script src="admin-comun.js"></script>
<script src="generos.js"></script>
<script src="paises.js"></script>
<script src="grados.js"></script>
<script src="lecturas.js"></script>
<script src="racha.js"></script>
<script src="premio-gordo-comun.js"></script>
<script src="puntos.js"></script>
<script src="lector-ajustes.js"></script>
<script src="motor.js"></script>
<script src="niveles-lectura.js"></script>
<script src="registro.js"></script>
<script src="auth.js"></script>


</body>


</html>
