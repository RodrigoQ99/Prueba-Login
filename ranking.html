<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Colegios</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<!-- ==========================
     MENÚ SUPERIOR (perfil / progreso / ranking)
=========================== -->
<div id="menuUsuario" class="menuUsuario" style="display:none;">
    <button id="btnMenuToggle" class="botonMenuToggle" aria-label="Abrir menú">
        <span id="menuNombre" class="menuNombreBoton">Mi cuenta</span>
        <span class="iconoMenu">☰</span>
    </button>

    <div id="panelMenu" class="panelMenu" style="display:none;">

        <div class="menuSeccion">
            <p class="menuTitulo">Mi progreso</p>

            <div class="menuStat">
                <span>Lecturas completadas</span>
                <strong id="menuCompletadas">0</strong>
            </div>

            <div class="menuStat">
                <span>Lecturas pendientes</span>
                <strong id="menuPendientes">0 de 0</strong>
            </div>
        </div>

        <a href="index.html" class="menuLink">📚 Mis lecturas</a>

        <a href="ranking.html" class="menuLink">🏆 Ver ranking de colegios</a>

        <button id="btnCerrarSesionMenu" class="menuLinkBoton">Cerrar sesión</button>

    </div>
</div>


<div id="contenedorRanking">

    <h1>Ranking de Colegios</h1>

    <p style="text-align:center; color:#555; margin-bottom:25px;">
        Se actualiza al instante cada vez que alguien completa una lectura.
        <span id="fechaActualizacion"></span>
    </p>

    <div id="listaRanking">
        <p style="text-align:center;">Cargando ranking...</p>
    </div>

    <div style="text-align:center; margin-top:25px;">
        <a href="index.html">← Volver a la lectura</a>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="lecturas.js"></script>
<script src="ranking.js"></script>
<script src="menu.js"></script>

</body>
</html>
