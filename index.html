<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inicio</title>

    <link rel="stylesheet"
          href="estilos.css">

    <!-- Firebase (versión compat, para usar sin bundler) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>


</head>


<body>


<!-- ==========================
     "¿QUÉ ES ESTO?" — SOLO en Inicio, mismo lugar/tamaño que el
     botón de menú (☰) de las demás pantallas, pero cuadrado.
=========================== -->
<button id="btnQueEsEsto" class="botonInfoInicio" title="¿Qué es esto?" style="display:none;">
    💡
</button>


<!-- ==========================
     PANTALLA DE LOGIN
=========================== -->
<div id="pantallaLogin" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1 class="marcaAuth">Trifle</h1>
        <blockquote class="citaAuth">
            <p>Un lector vive mil vidas antes de morir. El hombre que nunca lee vive solo una.</p>
            <cite>— George R.R. Martin</cite>
        </blockquote>
        <button id="btnLoginGoogle" class="botonGoogle">
            Iniciar sesión con Google
        </button>
    </div>
</div>


<!-- ==========================
     PANTALLA DE REGISTRO (solo primera vez)
=========================== -->
<div id="pantallaRegistro" class="pantallaAuth" style="display:none;"></div>
<!-- El formulario de registro (4 pasos) lo arma registro.js -->


<!-- ==========================
     INICIO — cuadrícula de todo lo que antes vivía en el menú ☰
=========================== -->
<div id="contenedor" style="display:none; max-width:560px; margin:0 auto; padding:30px 20px;">

    <h1 style="text-align:center; margin-bottom:20px;">Inicio</h1>

    <!-- Filtro Individual/Grupal (Etapa 34): por ahora TODO lo que existe
         es individual — las actividades grupales todavía no existen, ver
         inicio.js. Deja preparada la estructura para cuando se agreguen. -->
    <div id="filtroTipoActividad" style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
        <button type="button" id="btnFiltroIndividual" class="botonAdminChico">🧍 Individuales</button>
        <button type="button" id="btnFiltroGrupal" class="botonAdminChico">👥 Grupales</button>
    </div>

    <div class="gridBotonesCuadrados">

        <a href="perfil.html" class="botonCuadrado" data-tipo-actividad="individual" style="position:relative;">
            <span id="badgeRachaInicio" style="position:absolute; top:8px; right:10px; font-size:12px; font-weight:700; color:var(--texto-suave);"></span>
            <!-- Vacío a propósito: lo llena inicio.js con el avatar elegido
                 (o 👤 si todavía no eligió ninguno), para que no se vea
                 primero la silueta genérica y después el avatar. -->
            <span class="iconoBotonCuadrado" id="avatarInicio"></span>
            <span>Perfil</span>
        </a>

        <a href="lecturas.html" class="botonCuadrado" data-tipo-actividad="individual">
            <span class="iconoBotonCuadrado">📚</span>
            <span>Lecturas</span>
        </a>

        <a href="mejora.html" class="botonCuadrado" data-tipo-actividad="individual">
            <span class="iconoBotonCuadrado">📈</span>
            <span>Mejorar la lectura</span>
        </a>

        <a href="juegos.html" class="botonCuadrado" data-tipo-actividad="individual">
            <span class="iconoBotonCuadrado">🎮</span>
            <span>Juegos</span>
        </a>

        <a href="ranking.html" class="botonCuadrado" data-tipo-actividad="individual">
            <span class="iconoBotonCuadrado">🏆</span>
            <span>Ranking</span>
        </a>

        <a href="premios.html" class="botonCuadrado" data-tipo-actividad="individual">
            <span class="iconoBotonCuadrado">🎁</span>
            <span>Premios</span>
        </a>

    </div>

    <p id="mensajeSinActividadesGrupales" style="display:none; text-align:center; color:var(--texto-suave); margin-top:10px;">
        Todavía no hay actividades grupales — ¡muy pronto! 👥
    </p>

</div>


<script src="firebase-init.js"></script>
<script src="admin-comun.js"></script>
<script src="generos.js"></script>
<script src="paises.js"></script>
<script src="grados.js"></script>
<script src="racha.js"></script>
<script src="inicio.js"></script>
<script src="niveles-lectura.js"></script>
<script src="registro.js"></script>
<script src="auth.js"></script>
<script src="info-modal.js"></script>
<script src="saludo-ajolote.js"></script>


</body>


</html>
