<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premiador</title>
    <link rel="stylesheet" href="estilos.css">

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

</head>


<body>


<!-- ==========================
     PANTALLA DE LOGIN
=========================== -->
<div id="pantallaLoginPremiador" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Premiador</h1>
        <p>Inicia sesión con la cuenta autorizada para canjear premios.</p>
        <button id="btnLoginGooglePremiador" class="botonGoogle">
            Iniciar sesión con Google
        </button>
    </div>
</div>


<!-- ==========================
     SIN PERMISO
=========================== -->
<div id="pantallaSinPermiso" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Sin permiso</h1>
        <p>Esta cuenta no está autorizada para canjear premios.</p>
        <button id="btnCerrarSesionPremiador">Cerrar sesión</button>
    </div>
</div>


<!-- ==========================
     HERRAMIENTA DE CANJE
=========================== -->
<div id="contenedorPremiador" style="display:none;">

    <h1>🎟️ Canjear premio</h1>

    <div style="background:white; border-radius:14px; padding:30px; box-shadow:var(--sombra); border:1px solid var(--borde); margin-bottom:25px;">
        <form id="formCanjear">
            <input type="text" id="inputCodigo" placeholder="Código de 6 dígitos" maxlength="6" inputmode="numeric"
                   style="width:100%; padding:12px; font-size:20px; text-align:center; letter-spacing:4px; border-radius:8px; border:1px solid var(--borde); margin-bottom:12px;">
            <div id="resultadoCanje" style="display:none; text-align:center; margin-bottom:12px;"></div>
            <button type="submit">Canjear</button>
        </form>
    </div>

    <h2 style="text-align:center; margin-bottom:15px;">Resumen de canjes</h2>
    <div id="resumenPremiador" style="background:white; border-radius:14px; padding:20px; box-shadow:var(--sombra); border:1px solid var(--borde);"></div>

    <div style="text-align:center; margin-top:25px;">
        <button id="btnCerrarSesionPremiadorActivo"
                style="max-width:200px; display:inline-block; background:white; color:var(--texto-suave); border:1px solid var(--borde);">
            Cerrar sesión
        </button>
    </div>

</div>


<script src="firebase-init.js"></script>
<script src="premiador.js"></script>


</body>


</html>
