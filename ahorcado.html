<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorcado</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<!-- ==========================
     MENÚ SUPERIOR (perfil / progreso / ranking)
=========================== -->
<div id="menuUsuario" class="menuUsuario" style="display:none;">
    <button id="btnMenuToggle" class="botonMenuToggle" aria-label="Abrir menú">
        <span class="iconoMenu">☰</span>
    </button>

    <div id="panelMenu" class="panelMenu" style="display:none;">

        <div class="menuSeccion">
            <a href="perfil.html" class="menuTitulo" style="display:block; text-decoration:none; cursor:pointer;">Ir a perfil</a>

            <div class="menuStat">
                <span>Lecturas completadas</span>
                <strong id="menuCompletadas">0</strong>
            </div>

            <div class="menuStat">
                <span>Lecturas pendientes</span>
                <strong id="menuPendientes">0 de 0</strong>
            </div>
        </div>

        <a href="index.html" class="menuLink">🏠 Inicio</a>
        <a href="lecturas.html" class="menuLink">📚 Lecturas</a>
        <a href="mejora.html" class="menuLink">📈 Mejorar la lectura</a>
        <a href="ranking.html" class="menuLink">🏆 Ver ranking</a>
        <a href="juegos.html" class="menuLink">🎮 Juegos</a>
        <a href="premios.html" class="menuLink">🎁 Premios</a>

    </div>
</div>


<div id="contenedorAhorcado" style="max-width:600px; margin:40px auto; padding:0 20px;">

    <div style="display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;">
        <h1 style="margin:0;">🔤 Ahorcado</h1>
        <span id="contadorEsperaAhorcado"
              style="display:none; background:#fdecea; color:#c0392b; border:1px solid #f5c6cb; border-radius:999px; padding:3px 10px; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;">⏱️ --:--</span>
    </div>

    <p style="text-align:center; color:#555; margin-bottom:20px;">
        Adivina la palabra letra por letra (con tu teclado) antes de que se acaben tus oportunidades.
    </p>

    <!-- Solo visible al inicio, al terminar la ronda y durante la espera —
         nunca a media partida (ver actualizarVisibilidadSelectorVista). -->
    <div id="selectorVistaAhorcado" style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
        <button type="button" id="btnVistaJugar" class="botonAdminChico">🎮 Jugar</button>
        <button type="button" id="btnVistaDiccionario" class="botonAdminChico">📖 Ver diccionario</button>
    </div>

    <div id="juegoAhorcado">
        <p style="text-align:center;">Cargando...</p>
    </div>

    <!-- Teclado: en el teléfono, tocar este recuadro abre el teclado
         nativo; en computadora también se puede usar el teclado físico
         directamente (ver ahorcado.js). Vive FUERA de #juegoAhorcado
         para que no se destruya cada vez que se vuelve a dibujar el
         juego y el teclado del teléfono no se cierre. -->
    <input type="text" id="entradaLetraAhorcado"
           inputmode="text" autocomplete="off" autocapitalize="characters"
           autocorrect="off" spellcheck="false" maxlength="1"
           placeholder="Escribe una letra"
           aria-label="Escribe una letra para intentarla"
           style="display:none; margin:15px auto 0; width:220px; padding:12px; font-size:24px; text-align:center; text-transform:uppercase; border-radius:10px; border:2px solid var(--azul); box-sizing:border-box;">

    <div id="diccionarioAhorcado" style="display:none;"></div>

    <div style="text-align:center; margin-top:25px;">
        <a href="juegos.html">← Regresar a juegos</a>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="admin-comun.js"></script>
<script src="lecturas.js"></script>
<script src="racha.js"></script>
<script src="ahorcado.js"></script>
<script src="menu.js"></script>

</body>
</html>
