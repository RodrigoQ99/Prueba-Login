<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administrador</title>
    <link rel="stylesheet" href="estilos.css">

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

</head>


<body>


<!-- ==========================
     PANTALLA DE LOGIN
=========================== -->
<div id="pantallaLoginAdmin" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Panel de administrador</h1>
        <p>Inicia sesión con la cuenta autorizada para administrar el contenido.</p>
        <button id="btnLoginGoogleAdmin" class="botonGoogle">
            Iniciar sesión con Google
        </button>
    </div>
</div>


<!-- ==========================
     SIN PERMISO
=========================== -->
<div id="pantallaSinPermiso" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Sin permiso</h1>
        <p>Esta cuenta no está autorizada para administrar el contenido.</p>
        <button id="btnCerrarSesionAdminSinPermiso">Cerrar sesión</button>
    </div>
</div>


<!-- ==========================
     INICIO DEL PANEL (solo administradores)
=========================== -->
<div id="contenedorAdminPanel" style="display:none; max-width:560px; margin:0 auto; padding:30px 20px;">

    <h1 style="text-align:center; margin-bottom:30px;">🛠️ Panel de administrador</h1>

    <div class="gridBotonesAdmin">

        <a href="admin-premios.html" class="botonCuadradoAdmin">
            <span class="iconoBotonAdmin">🎁</span>
            <span>Premios</span>
        </a>

        <a href="admin-lecturas.html" class="botonCuadradoAdmin">
            <span class="iconoBotonAdmin">📚</span>
            <span>Lecturas</span>
        </a>

        <a href="admin-mejora.html" class="botonCuadradoAdmin">
            <span class="iconoBotonAdmin">📈</span>
            <span>Mejorar la lectura</span>
        </a>

        <a href="admin-juegos.html" class="botonCuadradoAdmin">
            <span class="iconoBotonAdmin">🎮</span>
            <span>Juegos</span>
        </a>

        <a href="admin-estadisticas.html" class="botonCuadradoAdmin">
            <span class="iconoBotonAdmin">📊</span>
            <span>Estadísticas</span>
        </a>

        <button type="button" id="btnAbrirAdministradores" class="botonCuadradoAdmin">
            <span class="iconoBotonAdmin">⚙️</span>
            <span>Administradores</span>
        </button>

    </div>

    <div style="text-align:center; margin-top:40px;">
        <button id="btnCerrarSesionAdmin"
                style="width:auto; padding:10px 20px; background:none; border:none; color:#c0392b; font-weight:600;">
            Cerrar sesión
        </button>
    </div>

</div>


<script src="firebase-init.js"></script>
<script src="admin-comun.js"></script>
<script src="admin.js"></script>
<script src="admin-panel.js"></script>


</body>


</html>
