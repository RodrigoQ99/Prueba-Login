<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administrador</title>
    <link rel="stylesheet" href="estilos.css">

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

</head>


<body>


<!-- ==========================
     PANTALLA DE LOGIN
=========================== -->
<div id="pantallaLoginAdmin" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Panel de administrador</h1>
        <p>Inicia sesión con la cuenta autorizada para administrar el contenido.</p>
        <button id="btnLoginGoogleAdmin" class="botonGoogle">
            Iniciar sesión con Google
        </button>
    </div>
</div>


<!-- ==========================
     SIN PERMISO
=========================== -->
<div id="pantallaSinPermiso" class="pantallaAuth" style="display:none;">
    <div class="cajaAuth">
        <h1>Sin permiso</h1>
        <p>Esta cuenta no está autorizada para administrar el contenido.</p>
        <button id="btnCerrarSesionAdminSinPermiso">Cerrar sesión</button>
    </div>
</div>


<!-- ==========================
     INICIO DEL PANEL (solo administradores)
=========================== -->
<div id="contenedorAdminPanel" style="display:none; min-height:100vh; flex-direction:column; align-items:center; padding:30px 20px; box-sizing:border-box;">

    <div style="max-width:560px; width:100%;">

        <h1 style="text-align:center; margin-bottom:30px;">🛠️ Panel de administrador</h1>

        <div class="gridBotonesCuadrados" style="justify-content:center;">

            <a href="admin-premios.html" class="botonCuadrado">
                <span class="iconoBotonCuadrado">🎁</span>
                <span>Premios</span>
            </a>

            <a href="admin-lecturas.html" class="botonCuadrado">
                <span class="iconoBotonCuadrado">📚</span>
                <span>Lecturas</span>
            </a>

            <a href="admin-mejora.html" class="botonCuadrado">
                <span class="iconoBotonCuadrado">📈</span>
                <span>Mejorar la lectura</span>
            </a>

            <a href="admin-juegos.html" class="botonCuadrado">
                <span class="iconoBotonCuadrado">🎮</span>
                <span>Juegos</span>
            </a>

            <a href="admin-estadisticas.html" class="botonCuadrado">
                <span class="iconoBotonCuadrado">📊</span>
                <span>Estadísticas</span>
            </a>

            <button type="button" id="btnAbrirAdministradores" class="botonCuadrado">
                <span class="iconoBotonCuadrado">⚙️</span>
                <span>Administradores</span>
            </button>

        </div>

        <div style="text-align:center; margin-top:40px;">
            <a href="index.html" target="_blank" class="botonAdminContorno"
               style="display:inline-block; padding:12px 22px; border-radius:12px; font-weight:600; text-decoration:none;">
                👤 Ir a la página de usuarios
            </a>
        </div>

    </div>

    <button id="btnCerrarSesionAdmin"
            style="margin-top:auto; padding:40px 20px 10px; width:auto; background:none; border:none; color:#c0392b; font-weight:600;">
        Cerrar sesión
    </button>

</div>


<script src="firebase-init.js"></script>
<script src="admin-comun.js"></script>
<script src="admin.js"></script>
<script src="admin-panel.js"></script>


</body>


</html>
